name: OpenHands CI Fix

on:
  workflow_run:
    workflows: ["Markdown Lint"]
    types: [completed]
  workflow_dispatch:
    inputs:
      failure_run_id:
        description: ID of the failed run
        required: true
        type: string
      failure_head_branch:
        description: Head branch of the failed run
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    uses: JacobPEvans/.github-ai/.github/workflows/cc-ci-fix.yml@b645e0a957bd5bc39040ef6f1acfea74ed40808b # feat/openhands-agent
    with:
      # Hosted runners cannot reach the model router; the review pool can.
      runner_label: review
      agent: openhands
      local_model: medium
      ci_structure: "Markdown Lint (markdownlint over every Markdown file in the repository)"
      failure_conclusion: ${{ github.event_name == 'workflow_dispatch' && 'failure' || '' }}
      failure_run_id: ${{ inputs.failure_run_id }}
      failure_head_branch: ${{ inputs.failure_head_branch }}
      failure_head_repository: ${{ github.event_name == 'workflow_dispatch' && github.repository || '' }}
      failure_actor: ${{ github.event_name == 'workflow_dispatch' && github.actor || '' }}
    secrets: inherit
