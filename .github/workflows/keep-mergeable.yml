name: Keep pull requests mergeable

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: keep-mergeable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-open-pull-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update behind branches and mark conflicts
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const query = `
              query($owner: String!, $name: String!, $cursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequests(states: OPEN, first: 100, after: $cursor) {
                    nodes { number headRefOid mergeStateStatus }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            `;

            const pullRequests = [];
            let cursor = null;
            let hasNextPage;
            do {
              const result = await github.graphql(query, { owner, name: repo, cursor });
              const page = result.repository.pullRequests;
              pullRequests.push(...page.nodes);
              ({ hasNextPage, endCursor: cursor } = page.pageInfo);
            } while (hasNextPage);

            for (const pullRequest of pullRequests) {
              core.info(`PR #${pullRequest.number}: ${pullRequest.mergeStateStatus}`);

              if (pullRequest.mergeStateStatus === 'BEHIND') {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: pullRequest.number,
                  expected_head_sha: pullRequest.headRefOid,
                });
              }

              if (pullRequest.mergeStateStatus === 'DIRTY') {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: 'conflict' });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: 'conflict',
                    color: 'd73a4a',
                    description: 'Pull request has merge conflicts',
                  });
                }

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                  labels: ['conflict'],
                });
              } else {
                const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
                  owner,
                  repo,
                  issue_number: pullRequest.number,
                });
                const conflictLabel = labels.find((label) => label.name.toLowerCase() === 'conflict');
                if (conflictLabel) {
                  await github.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: pullRequest.number,
                    name: conflictLabel.name,
                  });
                }
              }
            }
